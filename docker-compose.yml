services:
  student-reg-webapp:
    image: dockersyampawan/student-reg-webapp-private:1
    ports:
     - "9090:8080"
    deploy:
      mode: replicated
      replicas: 2 
      placement:
        constraints: [node.role == worker] 
    networks:
      - student-reg-webapp-overlay
networks:
  student-reg-webapp-overlay:
    driver: overlay
